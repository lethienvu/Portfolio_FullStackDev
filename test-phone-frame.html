<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; padding: 50px; }
    .device-phone {
      position: relative;
      width: 300px;
      margin: 0 auto;
    }
    .phone-frame-img {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      z-index: 3;
      pointer-events: none;
    }
    .device-phone__screen {
      position: absolute;
      top: 1.5%;
      left: 3%;
      width: 94%;
      height: 97%;
      overflow: hidden;
      border-radius: 35px;
      z-index: 1;
      background: #1a1a1a;
    }
    .skeleton-loader {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite linear;
      border-radius: 35px;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    img.content { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
    }
  </style>
</head>
<body>
  <div class="device-phone">
    <img src="src/assets/phone-frame.svg" alt="Phone Frame" class="phone-frame-img" />
    <div class="device-phone__screen">
      <div class="skeleton-loader"></div>
      <!-- Image will load here -->
    </div>
  </div>
</body>
</html>
